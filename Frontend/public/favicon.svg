<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Titanic D">
  <!-- El sello del login (Logo variant="emblem"), con los colores de theme.css ya resueltos:
       un favicon no lee las variables CSS de la página. -->
  <defs>
    <linearGradient id="td-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14497f" />
      <stop offset="100%" stop-color="#0e3560" />
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#td-disc)" />
  <circle cx="60" cy="60" r="49" fill="none" stroke="#b5700b" stroke-width="1.75" opacity="0.9" />

  <!-- espiga -->
  <g fill="#f7cb84">
    <ellipse cx="60" cy="30.5" rx="6" ry="9" />
    <ellipse cx="49.5" cy="43" rx="6" ry="9" transform="rotate(-26 49.5 43)" />
    <ellipse cx="70.5" cy="43" rx="6" ry="9" transform="rotate(26 70.5 43)" />
    <ellipse cx="49.5" cy="54" rx="6" ry="9" transform="rotate(-26 49.5 54)" />
    <ellipse cx="70.5" cy="54" rx="6" ry="9" transform="rotate(26 70.5 54)" />
    <ellipse cx="49.5" cy="65" rx="6" ry="9" transform="rotate(-26 49.5 65)" />
    <ellipse cx="70.5" cy="65" rx="6" ry="9" transform="rotate(26 70.5 65)" />
  </g>

  <!-- tallo y base -->
  <path d="M60 36 V 82" stroke="#f7cb84" stroke-width="2.25" stroke-linecap="round" />
  <circle cx="60" cy="88" r="7.5" fill="none" stroke="#f7cb84" stroke-width="2.25" />
  <path d="M52.5 88h15M60 80.5v15" stroke="#f7cb84" stroke-width="1.75" stroke-linecap="round" />
</svg>
